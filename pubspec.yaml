name: my_flutter_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.7+8

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  file_picker: ^8.0.0+1
  shared_preferences: ^2.2.2
  scrollable_positioned_list: ^0.3.0
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.10.0
  webview_flutter_wkwebview: ^3.16.0
