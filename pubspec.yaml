name: my_flutter_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  file_picker: ^8.0.0+1
  shared_preferences: ^2.2.2
  scrollable_positioned_list: ^0.3.0
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.10.0
  webview_flutter_wkwebview: ^3.16.0
  path_provider: ^2.1.1
  flutter_file_dialog: ^3.0.3
  image: ^4.7.2
  cloudbase_flutter: ^1.2.0
  flutter_local_notifications: ^22.2.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  share_plus: ^12.0.2
  package_info_plus: ^9.0.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/images/sutra_book.png
    - assets/images/sutra_book_selected.png
    - assets/images/chat.png
    - assets/images/chat_selected.png
    - assets/images/study.png
    - assets/images/study_selected.png
    - assets/images/my.png
    - assets/images/my_selected.png
    - assets/images/assistant.png
    - assets/images/assistant_selected.png
    - assets/images/search.png
    - assets/images/search_selected.png
    - assets/images/splash.png
    - assets/images/app_icon.png
    - assets/images/ic_comment.png
    - assets/images/ic_view.png
    - assets/images/star_filled.png
    - assets/images/star_outline.png
    - assets/sutras_catalog.json
    - assets/tool.html

flutter_native_splash:
  color: "#EDEDED"
  image: assets/images/splash.png
  fullscreen: false

  android: true
  android_gravity: fill

  ios: true
  ios_content_mode: scaleAspectFill

  # Android 12+ 的系统 Splash 只能显示"居中的方形图标"，无法全屏铺满。
  # 这里先不强行塞入 1080x2340 的长图（会被挤压/裁成一块），默认回退为 app icon。
  android_12:
    color: "#EDEDED"