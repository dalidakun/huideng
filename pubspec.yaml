    - assets/images/chat.png
    - assets/images/chat_selected.png
    - assets/images/study.png
    - assets/images/study_selected.png
    - assets/images/my.png
    - assets/images/my_selected.png
    - assets/images/assistant.png
    - assets/images/assistant_selected.png
    # 经藏页右上角助手入口：米黄外观图标。
    - assets/images/assistant000.png
    - assets/images/search.png
    - assets/images/search_selected.png
    - assets/images/splash.png
    # 米黄外观启动图（素白用 splash.png）。
    - assets/images/splash1.png
    - assets/images/app_icon.png
    - assets/images/ic_comment.png
    - assets/images/ic_view.png
    - assets/images/ic_clock.png
    - assets/images/star_filled.png
    - assets/images/star_outline.png
    - assets/images/weixin.png
    - assets/images/zhifubao.png
    - assets/images/01.png
    - assets/images/02.png
    - assets/images/03.png
    - assets/images/04.png
    - assets/images/fire.png
    # 素白外观底部导航黑色图标（原文件名 + 1）。
    - assets/images/study1.png
    - assets/images/study_selected1.png
    - assets/images/search1.png
    - assets/images/search_selected1.png
    - assets/images/sutra_book1.png
    - assets/images/sutra_book_selected1.png
    - assets/images/chat1.png
    - assets/images/chat_selected1.png
    - assets/images/my1.png
    - assets/images/my_selected1.png
    # 菩提空间菜单图标：米黄外观 mi1/mi2，素白外观 su1/su2。
    - assets/images/mi1.png
    - assets/images/mi2.png
    - assets/images/su1.png
    - assets/images/su2.png
    # 菩提空间页顶部标题图标：米黄外观 puti1，素白外观 puti2。
    - assets/images/puti1.png
    - assets/images/puti2.png
    # 菩提空间页右上角公告图标：米黄外观 gao1，素白外观 gao2。
    - assets/images/gao1.png
    - assets/images/gao2.png
    # 菩提空间页右下角悬浮按钮图标：添加笔记 write，回到顶部 top。
    - assets/images/write.png
    - assets/images/top.png
    # 经藏页「我的收藏」快捷入口图标。
    - assets/images/like.png
    # 经藏页「随缘读经」卡片标题图标。
    - assets/images/leaf-sharp.png
    - assets/sutras_catalog.json
    - assets/tool.html
    # 《用户协议》与《隐私政策》全文（首次启动弹窗与应用内「关于我们」共用）。
    - assets/agreements/user_agreement.md
    - assets/agreements/privacy_policy.md

flutter_native_splash:
  # 原生启动页只保留纯色底（不放图片）：图片由应用内 SplashImagePage
  # 按当前外观动态展示（米黄 splash1.png / 素白 splash.png），
  # 避免「先闪一张固定图再换图」。
  # fullscreen：原生阶段也隐藏状态栏，与应用内全屏启动图无缝衔接。
  color: "#EDEDED"
  fullscreen: true

  android: true
  android_gravity: fill

  ios: true
  ios_content_mode: scaleAspectFill

  # Android 12+ 鐨勭郴缁?Splash 鍙兘鏄剧ず"灞呬腑鐨勬柟褰㈠浘鏍?锛屾棤娉曞叏灞忛摵婊°€?
  # 杩欓噷鍏堜笉寮鸿濉炲叆 1080x2340 鐨勯暱鍥撅紙浼氳鎸ゅ帇/瑁佹垚涓€鍧楋級锛岄粯璁ゅ洖閫€涓?app icon銆?
  android_12:
    color: "#EDEDED"
