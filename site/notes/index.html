<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>交易笔记 · {{SITE_NAME}}</title>
<meta name="description" content="只对自己可见的交易笔记：记录入场理由、关键价位、止损与复盘，支持图文混排。">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F4ECD9">
<link rel="icon" type="image/png" href="{{REL}}assets/icon-round.png">
<link rel="stylesheet" href="{{REL}}assets/site.css?v={{ASSET_VER}}">
<link rel="stylesheet" href="{{REL}}assets/notes.css?v={{ASSET_VER}}">
<script>if(window.self!==window.top)document.documentElement.classList.add('is-embedded');</script>
</head>
<body class="notes-page">
<a class="skip-link" href="#notesMain">跳到主要内容</a>

<main class="notes-main" id="notesMain">
  <aside class="notes-side" id="sidePane" aria-label="笔记列表">
    <div class="notes-list" id="notesList" role="list">
      <p class="notes-list__empty">正在加载…</p>
    </div>
    <div class="notes-side__foot">
      <button type="button" class="notes-trash" id="btnTrash" aria-label="回收站" title="回收站">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6 7l1 12a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-12M10 11v5M14 11v5"/></svg>
      </button>
      <span id="quotaText">云空间用量加载中…</span>
      <button type="button" class="notes-fab" id="btnNew" aria-label="新建笔记" title="新建笔记"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
  </aside>

  <section class="notes-editor" id="editorPane" aria-label="笔记详情">
    <div class="notes-toolrow">
      <div class="notes-toolbar" id="toolbar" role="toolbar" aria-label="格式工具栏">
        <button type="button" class="tb-btn" id="tbImage" title="添加图片" aria-label="添加图片">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="8.2" cy="9.2" r="1.4"/><path d="M4 17l4.6-4.4 3 2.9 3.1-3.4L20 17"/></svg>
        </button>

        <button type="button" class="tb-btn" id="tbBullet" title="无序列表" aria-label="无序列表">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><circle cx="5" cy="6" r="1.7"/><rect x="9.5" y="5" width="11" height="2" rx="1"/><circle cx="5" cy="12" r="1.7"/><rect x="9.5" y="11" width="11" height="2" rx="1"/><circle cx="5" cy="18" r="1.7"/><rect x="9.5" y="17" width="11" height="2" rx="1"/></svg>
        </button>

        <button type="button" class="tb-btn tb-bold" data-cmd="bold" title="加粗"><span class="tb-glyph">B</span></button>
        <button type="button" class="tb-btn tb-italic" data-cmd="italic" title="斜体"><span class="tb-glyph">I</span></button>
        <button type="button" class="tb-btn tb-underline" data-cmd="underline" title="下划线"><span class="tb-glyph">U</span></button>

        <div class="tb-group">
          <button type="button" class="tb-btn tb-num" id="tbFont" title="字号"><span class="tb-glyph" id="tbFontLabel">16</span></button>
          <div class="tb-pop tb-font-pop tb-sizes" id="fontMenu" hidden>
            <button type="button" data-size="12">12</button>
            <button type="button" data-size="14">14</button>
            <button type="button" data-size="16" class="is-on">16</button>
            <button type="button" data-size="18">18</button>
            <button type="button" data-size="22">22</button>
            <button type="button" data-size="26">26</button>
            <button type="button" data-size="30">30</button>
            <button type="button" data-size="36">36</button>
          </div>
        </div>

        <div class="tb-group">
          <button type="button" class="tb-btn tb-color" id="tbColor" title="字体颜色" aria-label="字体颜色"><span class="tb-glyph">A</span><i></i></button>
          <div class="tb-pop tb-color-pop tb-colors" id="colorMenu" hidden></div>
        </div>

        <button type="button" class="tb-btn" id="tbClear" title="清除格式" aria-label="清除格式">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 15.8l7-9.2a2 2 0 0 1 2.8-.25l4.2 3.3a2 2 0 0 1 .25 2.8l-6.1 7.8H8.7z"/><path d="M7.8 13.8l6.8 5.3M9.5 20h9.5"/></svg>
        </button>
      </div>

      <button type="button" class="notes-save" id="btnSave">保存</button>
    </div>

    <div class="notes-editor__top">
      <button type="button" class="notes-back" id="btnBack" aria-label="返回笔记列表">←</button>
      <input id="noteTitle" class="notes-title" type="text" maxlength="100" autocomplete="off" spellcheck="false" placeholder="输入标题……">
      <span class="notes-meta">
        <span class="notes-date" id="noteDate"></span>
        <span class="notes-state" id="saveState">
          <svg class="notes-state__check" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5l3 3 6-6"/></svg>
          <span id="saveStateText"></span>
        </span>
      </span>
    </div>

    <div id="noteBody" class="notes-body" contenteditable="true" spellcheck="false" role="textbox" aria-multiline="true" aria-label="笔记正文"></div>
  </section>

  <div class="notes-split" id="splitBar" role="separator" aria-orientation="vertical" aria-label="拖动调整列表宽度" tabindex="0"></div>
</main>

<div class="notes-trash-panel" id="trashPanel" hidden>
  <div class="notes-trash-head">
    <span>回收站</span>
    <button type="button" id="trashClear">清空</button>
  </div>
  <div class="notes-trash-list" id="trashList"></div>
</div>

<div class="notes-lightbox" id="lightbox" hidden>
  <button type="button" class="notes-lightbox__close" id="lightboxClose" aria-label="关闭">×</button>
  <img id="lightboxImg" alt="笔记图片">
</div>

<input type="file" id="avatarInput" accept="image/jpeg,image/png,image/webp" hidden>
<input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp" multiple hidden>

<div class="notes-modal" id="shareModal" hidden>
  <div class="notes-modal__box" role="dialog" aria-modal="true" aria-labelledby="shareTitle">
    <h3 id="shareTitle">分享笔记</h3>
    <p class="notes-modal__hint">扫二维码，或在微信里长按/复制链接。</p>
    <img id="shareQr" alt="分享二维码" width="200" height="200">
    <input id="shareUrl" type="text" readonly>
    <div class="notes-modal__actions">
      <button type="button" class="notes-save" id="shareCopy">复制链接</button>
      <button type="button" class="notes-delete" id="shareNative">系统分享</button>
      <button type="button" class="notes-delete" id="shareClose">关闭</button>
    </div>
  </div>
</div>

<div class="notes-gate" id="loginGate" hidden>
  <div class="notes-gate__box">
    <h2>登录后使用交易笔记</h2>
    <p>笔记只对你自己可见，登录后换设备也能接着写。</p>
    <a class="btn btn--primary" id="gateLogin" href="{{REL}}index.html?next=notes#login">去登录</a>
    <a class="notes-gate__back" href="{{REL}}index.html">先看看行情</a>
  </div>
</div>

<div class="notes-toast" id="toast" hidden></div>

<script>
window.NOTES_CFG = {
  api: "{{API_URL}}",
  key: "{{API_KEY}}",
  rel: "{{REL}}",
  login: "{{REL}}index.html?next=notes#login"
};
</script>
<script src="{{REL}}assets/js/qrcode.min.js?v={{ASSET_VER}}"></script>
<script src="{{REL}}assets/js/notes.js?v={{ASSET_VER}}"></script>
</body>
</html>
