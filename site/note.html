<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>交易笔记 · {{SITE_NAME}}</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F4ECD9">
<link rel="icon" type="image/png" href="{{REL}}assets/icon-round.png">
<link rel="stylesheet" href="{{REL}}assets/site.css?v={{ASSET_VER}}">
<style>
  body.share-page {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
  }
  .share-nav {
    flex: none;
    display: flex;
    align-items: center;
    gap: 9px;
    height: 48px;
    padding: 0 14px;
    background: var(--nav-bg);
  }
  .share-nav img { width: 24px; height: 24px; }
  .share-nav b { font-size: 14px; font-weight: 600; }
  .share-nav .share-open {
    margin-left: auto;
    font-size: 12px;
    color: var(--accent-deep);
    text-decoration: none;
  }
  .share-main {
    flex: 1 1 auto;
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
    padding: 34px 20px 50px;
  }
  .share-title {
    font-size: 24px;
    line-height: 1.45;
    font-weight: 600;
    word-break: break-word;
  }
  .share-meta {
    margin-top: 8px;
    font-size: 11.5px;
    color: var(--text-hint);
  }
  .share-content {
    margin-top: 24px;
    font-size: 15px;
    line-height: 1.9;
    color: var(--text);
    word-break: break-word;
  }
  .share-content p, .share-content div { margin: 0; }
  .share-content p + p { margin-top: 0.6em; }
  .share-content ul, .share-content ol { margin: 0.5em 0; padding-left: 1.5em; }
  .share-content blockquote {
    margin: 0.6em 0;
    padding-left: 0.8em;
    color: var(--text-sec);
    background: rgba(236, 226, 202, 0.55);
  }
  .share-content a { color: var(--accent-deep); text-decoration: underline; }
  .share-content img {
    display: block;
    max-width: 100%;
    max-height: 70vh;
    width: auto;
    height: auto;
    margin: 10px 0;
    border-radius: 6px;
  }
  .share-foot {
    margin-top: 36px;
    padding-top: 14px;
    font-size: 11.5px;
    color: var(--text-hint);
  }
  .share-error {
    margin-top: 22px;
    font-size: 14px;
    color: var(--text-sec);
  }
</style>
</head>
<body class="share-page">
<header class="share-nav">
  <img src="{{REL}}{{BRAND_LOGO}}?v={{BRAND_LOGO_VER}}" alt="" width="24" height="24">
  <b>交易笔记</b>
  <a class="share-open" href="{{REL}}index.html#app">打开 {{SITE_NAME}}</a>
</header>

<main class="share-main">
  <h1 class="share-title" id="shareTitle">正在打开…</h1>
  <p class="share-meta" id="shareMeta"></p>
  <article class="share-content" id="shareContent"></article>
  <p class="share-error" id="shareError" hidden></p>
  <p class="share-foot">这条笔记由作者主动分享，内容仅代表作者个人记录。</p>
</main>

<script>
window.SHARE_CFG = {
  api: "{{API_URL}}",
  key: "{{API_KEY}}",
  rel: "{{REL}}"
};
</script>
<script src="{{REL}}assets/js/share-note.js?v={{ASSET_VER}}"></script>
</body>
</html>
