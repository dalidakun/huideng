<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>交易复盘 · {{SITE_NAME}}</title>
<meta name="description" content="把每一笔平仓记录下来，逐笔回看：进场理由、关键价位、当时的判断，以及事后怎么看。">
<meta name="robots" content="noindex,follow">
<meta name="theme-color" content="#F4ECD9">
<link rel="icon" type="image/png" href="{{REL}}assets/icon-round.png">
<link rel="stylesheet" href="{{REL}}assets/site.css?v={{ASSET_VER}}">
<link rel="stylesheet" href="{{REL}}assets/review.css?v={{ASSET_VER}}">
<script>if(window.self!==window.top)document.documentElement.classList.add('is-embedded');</script>
</head>
<body class="review-page">
<a class="skip-link" href="#reviewBody">跳到复盘正文</a>

{{SITE_NAV}}

<main class="review-layout" id="reviewMain">
  <aside class="review-list" aria-label="历史记录">
    <div class="review-list__head">
      <span>历史记录</span>
      <span class="review-list__acts">
        <select class="review-year" id="reviewYear" title="按年份导出" hidden></select>
        <button type="button" class="review-icon-btn" id="reviewRefresh" title="刷新记录">刷新</button>
        <button type="button" class="review-icon-btn review-icon-btn--primary" id="reviewExport" title="导出全部记录为 PDF">导出 PDF</button>
      </span>
    </div>
    <div class="review-list__items" id="reviewList"></div>
    <p class="review-list__empty" id="reviewListEmpty">还没有平仓记录，先去「交易练习」下几单。</p>
  </aside>

  <section class="review-editor" aria-label="交易复盘">
    <div class="review-editor__head">
      <span>交易复盘</span>
      <span class="review-editor__acts">
        <span class="review-saved" id="reviewSaved" hidden>已保存</span>
      </span>
    </div>
    <div class="review-info" id="reviewInfo" hidden></div>
    <div
      class="review-body"
      id="reviewBody"
      contenteditable="false"
      spellcheck="false"
      role="textbox"
      aria-multiline="true"
      data-placeholder="点左侧任意一笔交易，开始复盘……"
    ></div>
    <p class="review-hint" id="reviewHint">点左侧任意一笔交易，开始复盘……</p>
  </section>

  <aside class="review-stats" aria-label="阶段统计">
    <div class="review-stats__head">
      <span>阶段统计</span>
      <span class="review-stats__sub" id="reviewStageSub"></span>
    </div>
    <div class="review-chart-switch" role="group" aria-label="图表范围">
      <button type="button" class="is-on" data-mode="stage">阶段图</button>
      <button type="button" data-mode="all">全周期图</button>
    </div>
    <div class="review-chart">
      <canvas id="reviewChart" aria-label="资金收益变动曲线"></canvas>
    </div>
    <div class="review-stats__grid" id="reviewStats"></div>
  </aside>
</main>

<div class="review-lightbox" id="reviewLightbox" hidden>
  <img alt="查看大图" id="reviewLightboxImg">
</div>

<div class="review-print" id="reviewPrint" aria-hidden="true"></div>

<script src="{{REL}}assets/js/review.js?v={{ASSET_VER}}" defer></script>
</body>
</html>
