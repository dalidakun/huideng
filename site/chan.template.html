<!DOCTYPE html>
<html lang="zh-CN" class="page-chan">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>缠论读书会 · 缠中说禅《教你炒股票》108 课原文</title>
<meta name="description" content="缠中说禅《教你炒股票》系列 108 课全文，按课程顺序收录，含原文插图。逐课可单独分享。">
<meta name="theme-color" content="#F4ECD9">
<meta property="og:type" content="website">
<meta property="og:title" content="缠论读书会 · 教你炒股票 108 课">
<meta property="og:description" content="108 课原文与插图，按课排序，逐课可分享。">
<meta property="og:image" content="{{BASE_URL}}/assets/icon.png">
<meta property="og:url" content="{{BASE_URL}}/chan/index.html">
<meta name="twitter:card" content="summary">
<link rel="icon" type="image/png" href="{{REL}}assets/icon-round.png">
<link rel="apple-touch-icon" href="{{REL}}assets/icon.png">
<link rel="canonical" href="{{BASE_URL}}/chan/index.html">
<link rel="stylesheet" href="{{REL}}assets/site.css?v={{ASSET_VER}}">
<link rel="stylesheet" href="{{REL}}assets/chan.css?v={{ASSET_VER}}">
</head>
<body class="chan-page">
<script>if(window.self!==window.top)document.documentElement.classList.add('is-embedded');</script>
<a class="skip-link" href="#chanReader">跳到正文</a>

{{SITE_NAV}}

<main class="chan-layout" id="main">
  <h1 class="sr-only">缠论读书会 · 缠中说禅《教你炒股票》{{CHAN_COUNT}} 课</h1>

  <aside class="chan-side" id="chanSide" aria-label="课程目录">
    <div class="chan-side__head">
      <div class="chan-search" id="chanSearchBox" role="search">
        <span class="chan-search__ico" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>
        </span>
        <label class="sr-only" for="chanSearch">搜索课程标题</label>
        <input id="chanSearch" type="search" placeholder="搜索课程标题" autocomplete="off" spellcheck="false">
        <button type="button" class="chan-search__clear" id="chanSearchClear" aria-label="清除搜索" hidden>×</button>
      </div>
    </div>
    <nav class="chan-toc-wrap" aria-label="课程列表">
      <ol class="chan-toc" id="chanToc">{{CHAN_TOC}}</ol>
      <p class="chan-side__empty" id="chanEmpty" hidden>没有匹配的课程</p>
    </nav>
  </aside>

  <div class="chan-main">
    <div class="chan-bar">
      <button type="button" class="chan-bar__btn" id="chanTocBtn" aria-expanded="false" aria-controls="chanSide">目录</button>
      <span class="chan-bar__count" id="chanCount" aria-live="polite">第 1 / 108 课</span>
      <div class="chan-bar__group">
        <button type="button" class="chan-bar__icon" id="chanFontDown" aria-label="缩小字号" title="缩小字号">A−</button>
        <button type="button" class="chan-bar__icon" id="chanFontUp" aria-label="放大字号" title="放大字号">A+</button>
      </div>
      <div class="chan-bar__group">
        <button type="button" class="chan-bar__icon" id="chanPrev" aria-label="上一课" title="上一课（←）">↑</button>
        <button type="button" class="chan-bar__icon" id="chanNext" aria-label="下一课" title="下一课（→）">↓</button>
      </div>
    </div>

    <div class="chan-scroll" id="chanScroll">
      <div class="chan-reader" id="chanReader">
{{CHAN_ARTICLES}}
      </div>
    </div>

    <!-- 本课注释：当前文章右下角的悬浮入口，点开是本课所有读者的注释。
         数据由 assets/js/chan-annotations.js 按课拉取，课与课互不混淆。 -->
    <div class="chan-anno-dock" id="chanAnnoDock">
      <section class="chan-anno-panel" id="chanAnnoPanel" hidden role="dialog" aria-label="本课注释">
        <header class="chan-anno-panel__head">
          <span class="chan-anno-panel__title">本课注释</span>
          <span class="chan-anno-panel__count" id="chanAnnoCount" aria-live="polite">0</span>
          <button type="button" class="chan-anno-panel__icon" id="chanAnnoRefresh" aria-label="刷新注释" title="刷新">↻</button>
          <button type="button" class="chan-anno-panel__icon" id="chanAnnoClose" aria-label="关闭注释">×</button>
        </header>
        <p class="chan-anno-panel__hint">选中正文里的文字即可添加注释；这里是本课所有读者的注释（每 5 分钟同步，点 ↻ 立即刷新）。</p>
        <div class="chan-anno-panel__list" id="chanAnnoList"></div>
      </section>
      <button type="button" class="chan-anno-fab" id="chanAnnoFab" aria-expanded="false" aria-controls="chanAnnoPanel">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 15a3 3 0 0 1-3 3H8l-4 3V6a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3Z"/><path d="M8 8h8M8 12h5"/></svg>
        <span class="chan-anno-fab__label">注释</span>
        <span class="chan-anno-fab__count" id="chanAnnoFabCount">0</span>
      </button>
    </div>
  </div>

  <div class="chan-toc-scrim" id="chanTocScrim" hidden></div>
</main>

<!-- 选中文字后浮出的小按钮 -->
<div class="chan-anno-tip" id="chanAnnoTip" hidden>
  <button type="button" class="chan-anno-tip__btn" id="chanAnnoAdd">✎ 注释</button>
</div>

<!-- 写注释的弹层 -->
<div class="chan-anno-dialog" id="chanAnnoDialog" hidden>
  <div class="chan-anno-dialog__box" role="dialog" aria-modal="true" aria-labelledby="chanAnnoDialogTitle">
    <button type="button" class="chan-anno-dialog__close" id="chanAnnoDialogClose" aria-label="关闭">×</button>
    <h2 class="chan-anno-dialog__title" id="chanAnnoDialogTitle">添加注释</h2>
    <blockquote class="chan-anno-dialog__quote" id="chanAnnoDialogQuote"></blockquote>
    <label class="chan-anno-dialog__field">
      <span class="chan-anno-dialog__label">你的注释</span>
      <textarea id="chanAnnoNote" rows="4" maxlength="1000" placeholder="写下你的理解、补充或疑问…"></textarea>
      <span class="chan-anno-dialog__counter"><span id="chanAnnoNoteCount">0</span>/1000</span>
    </label>
    <label class="chan-anno-dialog__field chan-anno-dialog__field--name">
      <span class="chan-anno-dialog__label">署名</span>
      <input id="chanAnnoName" type="text" maxlength="20" placeholder="匿名读者" autocomplete="off" spellcheck="false">
    </label>
    <p class="chan-anno-dialog__tip">发布后，本课所有读者都能看到这条注释。</p>
    <p class="chan-anno-dialog__error" id="chanAnnoError" hidden></p>
    <div class="chan-anno-dialog__acts">
      <button type="button" class="chan-anno-dialog__btn" id="chanAnnoCancel">取消</button>
      <button type="button" class="chan-anno-dialog__btn chan-anno-dialog__btn--primary" id="chanAnnoSubmit">发布</button>
    </div>
  </div>
</div>

<script>
window.CHAN_CFG = {
  count: {{CHAN_COUNT}},
  rel: "{{REL}}",
  api: "{{API_URL}}",
  key: "{{API_KEY}}"
};
</script>
<script src="{{REL}}assets/js/chan.js?v={{ASSET_VER}}" defer></script>
<script src="{{REL}}assets/js/chan-annotations.js?v={{ASSET_VER}}" defer></script>
<script src="{{REL}}assets/js/chan-comments.js?v={{ASSET_VER}}" defer></script>
</body>
</html>
